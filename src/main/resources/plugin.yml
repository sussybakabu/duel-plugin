name: DuelPlugin
version: 1.0.0
main: com.example.duelplugin.DuelPlugin
api-version: '1.20'
authors: [ "codex" ]
description: Simple player duel plugin
commands:
  duel:
    description: Challenge another player to a duel
    usage: /duel <player>
  accept:
    description: Accept an incoming duel request
    usage: /accept
  deny:
    description: Deny an incoming duel request
    usage: /deny
